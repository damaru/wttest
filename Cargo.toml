[workspace]
members = ["server", "client"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
quinn = "0.11"
rustls = "0.23"
rcgen = "0.13"
webpki-roots = "0.26"
futures = "0.3"
bytes = "1.0"
clap = { version = "4.0", features = ["derive"] }
