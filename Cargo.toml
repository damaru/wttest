[workspace]
members = ["server", "client"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.0", features = ["derive"] }
axum = "0.8"
wtransport = { version = "0.7.2", default-features = false, features = ["self-signed", "aws-lc-rs", "dangerous-configuration"] }
